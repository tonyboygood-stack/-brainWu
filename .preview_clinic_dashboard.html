<title>平衡木中醫診所 · 創所儀表板</title>
<style>
  @font-face {
    font-family: 'DisplaySerifNum';
    src: local('Georgia');
    unicode-range: U+30-39, U+2E, U+25;
  }

  :root {
    --bg: #f6f1e6;
    --surface: #fffcf5;
    --surface-2: #efe6d3;
    --ink: #2b2620;
    --ink-soft: #6f6353;
    --ink-faint: #a89a83;
    --accent: #64744c;
    --accent-strong: #47552f;
    --accent-wash: #e4e6d5;
    --terracotta: #a06a3c;
    --terracotta-wash: #efdfc9;
    --amber: #b17a2a;
    --amber-wash: #f3e3c4;
    --rust: #9a4a3a;
    --rust-wash: #f0dbd2;
    --line: #ddd1b4;
    --line-soft: #ece2ca;
    --shadow: rgba(60, 50, 30, 0.10);
    --today-glow: rgba(100, 116, 76, 0.35);
    color-scheme: light;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #201c15;
      --surface: #29241c;
      --surface-2: #362f23;
      --ink: #ece3d1;
      --ink-soft: #b5a88f;
      --ink-faint: #7d735f;
      --accent: #93a678;
      --accent-strong: #b7c79c;
      --accent-wash: #333a26;
      --terracotta: #cf9a68;
      --terracotta-wash: #3d3122;
      --amber: #dba24f;
      --amber-wash: #3d3320;
      --rust: #d1897a;
      --rust-wash: #3b2822;
      --line: #423a2b;
      --line-soft: #342e23;
      --shadow: rgba(0, 0, 0, 0.35);
      --today-glow: rgba(147, 166, 120, 0.35);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #201c15; --surface: #29241c; --surface-2: #362f23;
    --ink: #ece3d1; --ink-soft: #b5a88f; --ink-faint: #7d735f;
    --accent: #93a678; --accent-strong: #b7c79c; --accent-wash: #333a26;
    --terracotta: #cf9a68; --terracotta-wash: #3d3122;
    --amber: #dba24f; --amber-wash: #3d3320;
    --rust: #d1897a; --rust-wash: #3b2822;
    --line: #423a2b; --line-soft: #342e23;
    --shadow: rgba(0, 0, 0, 0.35); --today-glow: rgba(147, 166, 120, 0.35);
    color-scheme: dark;
  }
  :root[data-theme="light"] {
    --bg: #f6f1e6; --surface: #fffcf5; --surface-2: #efe6d3;
    --ink: #2b2620; --ink-soft: #6f6353; --ink-faint: #a89a83;
    --accent: #64744c; --accent-strong: #47552f; --accent-wash: #e4e6d5;
    --terracotta: #a06a3c; --terracotta-wash: #efdfc9;
    --amber: #b17a2a; --amber-wash: #f3e3c4;
    --rust: #9a4a3a; --rust-wash: #f0dbd2;
    --line: #ddd1b4; --line-soft: #ece2ca;
    --shadow: rgba(60, 50, 30, 0.10); --today-glow: rgba(100, 116, 76, 0.35);
    color-scheme: light;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "PingFang TC", "Microsoft JhengHei", "Helvetica Neue", Arial, sans-serif;
    font-size: 15px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  .serif {
    font-family: "Noto Serif TC", "Songti TC", "PMingLiU", "DisplaySerifNum", serif;
  }
  .tnum { font-variant-numeric: tabular-nums; }
  .eyebrow {
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--ink-faint);
    font-weight: 600;
  }

  .wrap { max-width: 1080px; margin: 0 auto; padding: 28px 24px 80px; }

  /* ---------- Header ---------- */
  header.top {
    display: flex;
    flex-wrap: wrap;
    align-items: flex-end;
    justify-content: space-between;
    gap: 20px;
    padding-bottom: 22px;
    border-bottom: 1px solid var(--line);
    margin-bottom: 26px;
  }
  .brand { display: flex; flex-direction: column; gap: 6px; }
  .brand .mark {
    display: inline-flex;
    align-items: center;
    gap: 8px;
  }
  .brand .mark .beamdot {
    width: 9px; height: 9px; border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 0 4px var(--accent-wash);
  }
  .brand h1 {
    margin: 0;
    font-size: 26px;
    font-weight: 700;
    text-wrap: balance;
  }
  .brand p.sub {
    margin: 0;
    color: var(--ink-soft);
    font-size: 13.5px;
  }

  .stats {
    display: flex;
    gap: 14px;
    flex-wrap: wrap;
  }
  .stat {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 10px 16px;
    min-width: 118px;
    box-shadow: 0 1px 2px var(--shadow);
  }
  .stat .eyebrow { display: block; margin-bottom: 3px; }
  .stat .num {
    font-size: 24px;
    font-weight: 700;
    color: var(--accent-strong);
  }
  .stat .num.terracotta { color: var(--terracotta); }
  .stat .unit { font-size: 12px; color: var(--ink-soft); margin-left: 2px; }

  /* progress segmented bar */
  .progress-block { margin-top: 18px; }
  .progress-bar {
    display: flex;
    height: 8px;
    border-radius: 5px;
    overflow: hidden;
    background: var(--line-soft);
    border: 1px solid var(--line);
  }
  .progress-bar span { height: 100%; }
  .seg-done { background: var(--accent); }
  .seg-progress { background: var(--amber); }
  .seg-question { background: var(--rust); }
  .progress-legend {
    display: flex;
    gap: 16px;
    margin-top: 8px;
    flex-wrap: wrap;
    font-size: 12.5px;
    color: var(--ink-soft);
  }
  .progress-legend span.dot {
    display: inline-block; width: 8px; height: 8px; border-radius: 50%;
    margin-right: 5px; vertical-align: middle;
  }

  /* ---------- Tabs ---------- */
  .tabs {
    display: flex;
    gap: 6px;
    margin-bottom: 22px;
    border-bottom: 1px solid var(--line);
  }
  .tab-btn {
    appearance: none;
    background: none;
    border: none;
    font-family: inherit;
    font-size: 14.5px;
    font-weight: 600;
    color: var(--ink-soft);
    padding: 10px 6px;
    cursor: pointer;
    border-bottom: 2px solid transparent;
    margin-bottom: -1px;
  }
  .tab-btn:hover { color: var(--ink); }
  .tab-btn.active {
    color: var(--accent-strong);
    border-bottom-color: var(--accent);
  }
  .tab-btn:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  .panel { display: none; }
  .panel.active { display: block; }

  /* ---------- Timeline (beam) ---------- */
  .beam-scroll {
    overflow-x: auto;
    padding-bottom: 6px;
    margin: 0 -4px 18px;
  }
  .beam-note {
    color: var(--ink-soft);
    font-size: 13px;
    margin: 0 0 18px;
  }
  .beam-outer {
    position: relative;
    min-width: 980px;
    padding: 64px 24px 100px;
  }
  .beam-line {
    position: absolute;
    left: 24px; right: 24px; top: 96px;
    height: 4px;
    border-radius: 3px;
    background: linear-gradient(90deg, var(--line), var(--accent) 4%, var(--accent) 96%, var(--line));
    opacity: 0.55;
  }
  .beam-months {
    position: relative;
    height: 20px;
  }
  .beam-month {
    position: absolute;
    top: 0;
    transform: translateX(-50%);
    font-size: 12px;
    color: var(--ink-faint);
    letter-spacing: 0.06em;
  }
  .beam-today {
    position: absolute;
    top: 40px;
    width: 2px;
    height: 220px;
    background: repeating-linear-gradient(var(--accent-strong) 0 4px, transparent 4px 8px);
    transform: translateX(-50%);
  }
  .beam-today-label {
    position: absolute;
    top: 16px;
    transform: translateX(-50%);
    background: var(--accent);
    color: var(--surface);
    font-size: 11px;
    font-weight: 700;
    padding: 3px 9px;
    border-radius: 999px;
    white-space: nowrap;
    box-shadow: 0 2px 6px var(--today-glow);
  }
  .milestone {
    position: absolute;
    top: 96px;
    transform: translate(-50%, -50%);
    width: 15px; height: 15px;
    border-radius: 50%;
    border: 2px solid var(--accent);
    background: var(--surface);
    cursor: pointer;
    transition: transform .12s ease;
  }
  .milestone:hover, .milestone:focus-visible { transform: translate(-50%, -50%) scale(1.25); outline: none; }
  .milestone.done { background: var(--accent); }
  .milestone.progress { border-color: var(--amber); }
  .milestone.progress.filled { background: var(--amber); }
  .milestone.question { border-color: var(--rust); border-style: dashed; }
  .milestone.todo { border-color: var(--ink-faint); }

  .milestone-card {
    position: absolute;
    width: 168px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 10px 12px;
    box-shadow: 0 2px 8px var(--shadow);
    font-size: 12.5px;
    line-height: 1.45;
  }
  .milestone-card .mdate {
    font-size: 11px; color: var(--ink-faint); margin-bottom: 3px;
    font-variant-numeric: tabular-nums;
  }
  .milestone-card .mtext { color: var(--ink); font-weight: 500; }
  .milestone-card::after {
    content: "";
    position: absolute;
    left: 50%;
    width: 8px; height: 8px;
    background: var(--surface);
    border: 1px solid var(--line);
    transform: translateX(-50%) rotate(45deg);
  }
  .milestone-card.up::after { bottom: -5px; border-top: none; border-left: none; }
  .milestone-card.down::after { top: -5px; border-bottom: none; border-right: none; }
  .milestone-card.up { top: -18px; transform: translate(-50%, -100%); }
  .milestone-card.down { top: 114px; }

  /* status pill (shared) */
  .pill {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 11.5px;
    font-weight: 600;
    padding: 3px 9px;
    border-radius: 999px;
    white-space: nowrap;
    border: 1px solid transparent;
  }
  .pill.done { background: var(--accent-wash); color: var(--accent-strong); }
  .pill.progress { background: var(--amber-wash); color: var(--amber); }
  .pill.question { background: var(--rust-wash); color: var(--rust); }
  .pill.todo { background: var(--line-soft); color: var(--ink-soft); }
  .pill .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }

  /* ---------- Checklist ---------- */
  .cat {
    border: 1px solid var(--line);
    border-radius: 12px;
    background: var(--surface);
    margin-bottom: 12px;
    overflow: hidden;
  }
  .cat-head {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 14px 18px;
    background: none;
    border: none;
    font-family: inherit;
    cursor: pointer;
    text-align: left;
    color: var(--ink);
  }
  .cat-head:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .cat-title { display: flex; align-items: baseline; gap: 10px; }
  .cat-title h2 { margin: 0; font-size: 16px; font-weight: 700; }
  .cat-title .count { font-size: 12px; color: var(--ink-faint); }
  .cat-chevron {
    transition: transform .15s ease;
    color: var(--ink-faint);
    flex: none;
  }
  .cat.open .cat-chevron { transform: rotate(90deg); }
  .cat-mini-bar {
    flex: 1;
    max-width: 160px;
    height: 5px;
    border-radius: 4px;
    background: var(--line-soft);
    overflow: hidden;
    display: flex;
  }
  .cat-mini-bar span { height: 100%; }

  .cat-body {
    display: none;
    border-top: 1px solid var(--line);
  }
  .cat.open .cat-body { display: block; }

  .item {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 12px 18px;
    border-top: 1px solid var(--line-soft);
  }
  .item:first-child { border-top: none; }
  .item-btn {
    appearance: none;
    border: none;
    background: none;
    padding: 0;
    cursor: pointer;
    flex: none;
    margin-top: 1px;
  }
  .item-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 999px; }
  .item-text { flex: 1; min-width: 0; }
  .item-text .main { color: var(--ink); }
  .item.is-done .main { color: var(--ink-soft); text-decoration: line-through; text-decoration-color: var(--line); }
  .item-text .note { display: block; font-size: 12.5px; color: var(--ink-soft); margin-top: 3px; }
  .item-date {
    font-size: 11.5px;
    color: var(--ink-faint);
    white-space: nowrap;
    flex: none;
    font-variant-numeric: tabular-nums;
    padding-top: 2px;
  }

  footer.foot {
    margin-top: 34px;
    padding-top: 16px;
    border-top: 1px solid var(--line);
    color: var(--ink-faint);
    font-size: 12px;
    display: flex;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
  }

  @media (max-width: 640px) {
    .wrap { padding: 20px 16px 60px; }
    .stats { width: 100%; }
    .stat { flex: 1; min-width: 90px; }
  }
</style>

<div class="wrap">

  <header class="top">
    <div class="brand">
      <span class="mark eyebrow"><span class="beamdot"></span>創所儀表板</span>
      <h1 class="serif">平衡木中醫診所</h1>
      <p class="sub">東湖 · 日式簡約自費針灸診所 &nbsp;·&nbsp; 顧問頤固 &nbsp;·&nbsp; 融資和潤</p>
    </div>
    <div class="stats">
      <div class="stat">
        <span class="eyebrow">距離離職</span>
        <span class="num tnum serif" id="stat-leave">–</span><span class="unit">天</span>
      </div>
      <div class="stat">
        <span class="eyebrow">目標開業</span>
        <span class="num tnum serif terracotta" id="stat-open">–</span><span class="unit">天</span>
      </div>
      <div class="stat">
        <span class="eyebrow">代辦完成</span>
        <span class="num tnum serif" id="stat-done">–</span><span class="unit" id="stat-total-unit"></span>
      </div>
    </div>
  </header>

  <div class="progress-block">
    <div class="progress-bar" id="progress-bar"></div>
    <div class="progress-legend">
      <span><span class="dot" style="background:var(--accent)"></span>完成 <b id="lg-done">0</b></span>
      <span><span class="dot" style="background:var(--amber)"></span>進行中 <b id="lg-progress">0</b></span>
      <span><span class="dot" style="background:var(--rust)"></span>待確認 / 需要你決定 <b id="lg-question">0</b></span>
      <span><span class="dot" style="background:var(--ink-faint)"></span>待開始 <b id="lg-todo">0</b></span>
    </div>
  </div>

  <div class="tabs" role="tablist">
    <button class="tab-btn active" id="tab-beam-btn" role="tab" aria-selected="true">時序木道</button>
    <button class="tab-btn" id="tab-list-btn" role="tab" aria-selected="false">分類代辦</button>
  </div>

  <section class="panel active" id="panel-beam">
    <p class="beam-note">從今天走到開業日的木道。實心圓＝已完成，琥珀圓＝進行中，虛線圓＝待你確認，灰圓＝待開始。點一下看細節；已完成的歷史里程碑（選址、簽約、融資）收在下方清單分類「時程與交接」裡。</p>
    <div class="beam-scroll">
      <div class="beam-outer" id="beam-outer">
        <div class="beam-months" id="beam-months"></div>
        <div class="beam-line"></div>
        <!-- today marker + milestones injected by JS -->
      </div>
    </div>
  </section>

  <section class="panel" id="panel-list">
    <div id="cat-list"></div>
  </section>

  <footer class="foot">
    <span>最後整理：2026-08-02 · 老吳與 AI 分身共同彙整</span>
    <span>勾選狀態會存在這台裝置的瀏覽器裡；內容更新請回來請 AI 分身重新整理</span>
  </footer>

</div>

<script>
(function () {
  "use strict";

  // ---------- Data ----------
  // status: 'done' | 'progress' | 'question' | 'todo'
  // date (optional): ISO date string -> also rendered on the beam
  // isTarget: true => date is a planning target, not a locked-in date
  var TASKS = [
    // 時程與交接
    { id: "tl-01", cat: "時程與交接", text: "東湖選址簽約", status: "done", note: "2026-04-26（早於本頁時序範圍，不畫在木道上）" },

    { id: "tl-04", cat: "時程與交接", text: "裝修執照核發、水電工程開工", status: "done", note: "2026-06-28" },
    { id: "tl-05", cat: "時程與交接", text: "和潤租賃融資簽約（550萬）", status: "done", note: "2026-07-20" },
    { id: "tl-06", cat: "時程與交接", text: "首筆撥款到位（約324萬，成舍設計費＋冷氣）", status: "done", date: "2026-08-02" },
    { id: "tl-07", cat: "時程與交接", text: "取得最新 3D 建模設計圖", status: "progress", date: "2026-08-09", isTarget: true, note: "本週內拿到" },
    { id: "tl-08", cat: "時程與交接", text: "離開南京東路欣悅中醫", status: "todo", date: "2026-10-18" },
    { id: "tl-09", cat: "時程與交接", text: "離職交接分寸：南京東路病人是否主動告知去處", status: "question", note: "避免與前東家有競業 / 職業道德爭議，需要想清楚怎麼講" },
    { id: "tl-10", cat: "時程與交接", text: "10/18–10/25 緩衝安排：無縫接軌 or 休息一週", status: "question", note: "你說「順利的話無縫接軌，或休息一週如10/25」——實際要哪一種，看裝修/證照進度到時候再拍板" },

    { id: "tl-12", cat: "時程與交接", text: "目標開業", status: "todo", date: "2026-10-25", note: "如提前無縫接軌可能更早；抓一週緩衝則落在此日" },

    // 法規與行政
    { id: "reg-01", cat: "法規與行政", text: "診所統一編號申請", status: "question", note: "關鍵前置任務——發票、會計記帳、勞健保投保、和潤下一批撥款可能都要卡這個，需要先確認現在有沒有啟動" },
    { id: "reg-02", cat: "法規與行政", text: "中醫診所開業執照正式申請（衛生局）", status: "todo" },
    { id: "reg-03", cat: "法規與行政", text: "消防／公安查驗", status: "todo", note: "裝修完成後才能約，通常要排隊，建議提早卡位詢問" },

    { id: "reg-05", cat: "法規與行政", text: "醫療責任保險 + 公共意外保險", status: "todo" },
    { id: "reg-06", cat: "法規與行政", text: "生物醫療廢棄物清運合約", status: "todo", note: "針具／藥棉等，法規要求特定清運商" },
    { id: "reg-07", cat: "法規與行政", text: "勞健保雇主戶設立", status: "todo" },

    // 財務與會計
    { id: "fin-01", cat: "財務與會計", text: "家人支援資金 200 萬到位", status: "done" },
    { id: "fin-02", cat: "財務與會計", text: "和潤租賃融資 550 萬簽約", status: "done", note: "2026-07-20，同「時程與交接」tl-05" },
    { id: "fin-03", cat: "財務與會計", text: "首筆撥款約 324 萬到位", status: "done", note: "2026-08-02，同「時程與交接」tl-06" },
    { id: "fin-04", cat: "財務與會計", text: "耗材規劃 40 萬（順鑫）簽約", status: "done", note: "已列入租賃，可能併入和潤下一批撥款" },
    { id: "fin-05", cat: "財務與會計", text: "會計師人選：請「大千」推薦", status: "question", note: "預計等裝修完成、拿到統編後啟動接洽" },
    { id: "fin-06", cat: "財務與會計", text: "開業前稅務規劃會談", status: "todo" },
    { id: "fin-07", cat: "財務與會計", text: "記帳／發票系統建立", status: "todo", note: "電子發票或手開？是否要串 POS？" },

    // 空間與設備
    { id: "sp-01", cat: "空間與設備", text: "裝修施工", status: "progress", note: "目前進行順利" },
    { id: "sp-02", cat: "空間與設備", text: "3D 建模示意圖確認", status: "progress", note: "本週內取得，同「時程與交接」tl-07" },
    { id: "sp-03", cat: "空間與設備", text: "遠紅外線治療儀：確認採購 TY101F", status: "done", note: "走租賃（和潤）" },
    { id: "sp-04", cat: "空間與設備", text: "5/28 設計師會議待確認項（診療床電動/手動、消毒設備選型、治療推車數量、艾灸排煙管線）", status: "question", note: "先擱置，等最新 3D 設計圖回來後一併確認" },
    { id: "sp-05", cat: "空間與設備", text: "藥材冷藏／倉儲空間與效期管理制度", status: "todo" },

    // 供應商
    { id: "sup-01", cat: "供應商", text: "耗材：順鑫醫療器材", status: "done", note: "已簽 40 萬規劃，列入租賃" },
    { id: "sup-02", cat: "供應商", text: "耗材：漢柏國際（比較用，視情況是否還需要）", status: "todo" },
    { id: "sup-03", cat: "供應商", text: "藥材：德利泰興業 / 金記寶安 比價", status: "todo" },

    // 人員招募
    { id: "hr-01", cat: "人員招募", text: "護理／助理人員招募", status: "todo", date: "2026-08-15", isTarget: true, note: "建議現在就啟動：合格人選搶手，加上執業登記異動約需 2–4 週行政作業" },
    { id: "hr-02", cat: "人員招募", text: "行政／櫃檯人員招募", status: "todo", date: "2026-09-20", isTarget: true, note: "開業前 3–4 週啟動即可" },
    { id: "hr-03", cat: "人員招募", text: "勞動合約準備（定期/不定期、試用期、保密協議、競業禁止條款）", status: "todo" },
    { id: "hr-04", cat: "人員招募", text: "勞健保投保作業", status: "todo" },

    // 品牌與行銷
    { id: "br-01", cat: "品牌與行銷", text: "診所命名：平衡木中醫診所", status: "done" },
    { id: "br-02", cat: "品牌與行銷", text: "LOGO 設計（巧薇）", status: "progress" },
    { id: "br-03", cat: "品牌與行銷", text: "官網建立", status: "todo" },
    { id: "br-04", cat: "品牌與行銷", text: "社群平台建立（IG / FB / LINE 官方帳號）", status: "todo" },
    { id: "br-05", cat: "品牌與行銷", text: "Google 商家地圖上架", status: "todo" },
    { id: "br-06", cat: "品牌與行銷", text: "線上預約掛號系統", status: "todo" },
    { id: "br-07", cat: "品牌與行銷", text: "專屬衛教影片製作", status: "todo" },
    { id: "br-08", cat: "品牌與行銷", text: "醫師形象照 / 簡介影片", status: "todo" },

    // 醫療服務與定價
    { id: "sv-01", cat: "醫療服務與定價", text: "醫療服務內容盤點與完善", status: "progress", note: "目前僅感冒／內科調理草稿，需逐步完善並放上網站" },
    { id: "sv-02", cat: "醫療服務與定價", text: "自費定價結構（初診／複診／療程）", status: "question", note: "已經有人開始詢問，急迫" },
    { id: "sv-03", cat: "醫療服務與定價", text: "健保是否保留評估", status: "todo" },

    // 數位工具
    { id: "ai-01", cat: "數位工具", text: "clinic-ai-assistant：語音轉錄＋校正＋病歷摘要＋RAG鑑別診斷", status: "done", note: "三階段已完成" },
    { id: "ai-02", cat: "數位工具", text: "clinic-ai-assistant 持續升級", status: "progress", note: "近期重點項目" }
  ];

  var CATS = ["時程與交接", "法規與行政", "財務與會計", "空間與設備", "供應商", "人員招募", "品牌與行銷", "醫療服務與定價", "數位工具"];

  var STORE_KEY = "pbmu-clinic-dashboard-v1";

  // ---------- State (localStorage overrides) ----------
  var overrides = {};
  try { overrides = JSON.parse(localStorage.getItem(STORE_KEY) || "{}"); } catch (e) { overrides = {}; }

  function getStatus(task) {
    return overrides[task.id] || task.status;
  }
  function setStatus(id, status) {
    overrides[id] = status;
    try { localStorage.setItem(STORE_KEY, JSON.stringify(overrides)); } catch (e) {}
  }
  var CYCLE = ["todo", "progress", "question", "done"];
  function nextStatus(s) {
    var i = CYCLE.indexOf(s);
    return CYCLE[(i + 1) % CYCLE.length];
  }

  var STATUS_LABEL = { done: "完成", progress: "進行中", question: "待確認", todo: "待開始" };

  // ---------- Render: stats + progress ----------
  function daysUntil(iso) {
    var target = new Date(iso + "T00:00:00");
    var now = new Date();
    var startOfToday = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    return Math.round((target - startOfToday) / 86400000);
  }

  function renderStats() {
    document.getElementById("stat-leave").textContent = daysUntil("2026-10-18");
    document.getElementById("stat-open").textContent = daysUntil("2026-10-25");

    var counts = { done: 0, progress: 0, question: 0, todo: 0 };
    TASKS.forEach(function (t) { counts[getStatus(t)]++; });
    var total = TASKS.length;

    document.getElementById("stat-done").textContent = counts.done;
    document.getElementById("stat-total-unit").textContent = " / " + total + " 項";

    var bar = document.getElementById("progress-bar");
    bar.innerHTML = "";
    [["seg-done", counts.done], ["seg-progress", counts.progress], ["seg-question", counts.question]].forEach(function (seg) {
      if (seg[1] > 0) {
        var span = document.createElement("span");
        span.className = seg[0];
        span.style.width = (seg[1] / total * 100) + "%";
        bar.appendChild(span);
      }
    });
    document.getElementById("lg-done").textContent = counts.done;
    document.getElementById("lg-progress").textContent = counts.progress;
    document.getElementById("lg-question").textContent = counts.question;
    document.getElementById("lg-todo").textContent = counts.todo;
  }

  // ---------- Render: beam timeline ----------
  var BEAM_START = new Date("2026-08-02T00:00:00");
  var BEAM_END = new Date("2026-11-08T00:00:00");

  function pctFor(dateIso) {
    var d = new Date(dateIso + "T00:00:00");
    var pct = (d - BEAM_START) / (BEAM_END - BEAM_START) * 100;
    return Math.max(1, Math.min(99, pct));
  }

  function renderBeam() {
    var outer = document.getElementById("beam-outer");
    // clear previously injected nodes (keep months + line which we rebuild too)
    outer.querySelectorAll(".milestone, .milestone-card, .beam-today, .beam-today-label").forEach(function (n) { n.remove(); });

    // month labels
    var monthsEl = document.getElementById("beam-months");
    monthsEl.innerHTML = "";
    var months = [
      ["2026-08-01", "8月"], ["2026-09-01", "9月"], ["2026-10-01", "10月"], ["2026-11-01", "11月"]
    ];
    months.forEach(function (m) {
      var el = document.createElement("div");
      el.className = "beam-month";
      el.style.left = pctFor(m[0]) + "%";
      el.textContent = m[1];
      monthsEl.appendChild(el);
    });

    // today marker
    var todayPct = pctFor(new Date().toISOString().slice(0, 10));
    var todayLine = document.createElement("div");
    todayLine.className = "beam-today";
    todayLine.style.left = todayPct + "%";
    outer.appendChild(todayLine);
    var todayLabel = document.createElement("div");
    todayLabel.className = "beam-today-label";
    todayLabel.style.left = todayPct + "%";
    todayLabel.textContent = "今天";
    outer.appendChild(todayLabel);

    // milestones (sorted chronologically so up/down alternation follows the beam, not source order)
    var dated = TASKS.filter(function (t) { return !!t.date; }).sort(function (a, b) { return a.date.localeCompare(b.date); });
    dated.forEach(function (t, i) {
      var pct = pctFor(t.date);
      var status = getStatus(t);
      var dot = document.createElement("button");
      dot.className = "milestone " + status + (status === "done" || (status === "progress" && overrides[t.id] === "done") ? " filled" : "");
      if (status === "done") dot.classList.add("filled");
      dot.style.left = pct + "%";
      dot.setAttribute("aria-label", t.text);
      dot.setAttribute("data-id", t.id);
      outer.appendChild(dot);

      var card = document.createElement("div");
      var up = (i % 2 === 0);
      card.className = "milestone-card " + (up ? "up" : "down");
      card.style.left = pct + "%";
      var dateLabel = t.date.slice(5).replace("-", "/") + (t.isTarget ? "（目標）" : "");
      card.innerHTML = '<div class="mdate tnum">' + dateLabel + '</div><div class="mtext">' + t.text + '</div>';
      outer.appendChild(card);

      dot.addEventListener("click", function () {
        setStatus(t.id, nextStatus(getStatus(t)));
        renderAll();
      });
    });
  }

  // ---------- Render: checklist ----------
  var openCats = {};

  function renderList() {
    var root = document.getElementById("cat-list");
    root.innerHTML = "";
    CATS.forEach(function (cat, idx) {
      var items = TASKS.filter(function (t) { return t.cat === cat; });
      var counts = { done: 0, progress: 0, question: 0, todo: 0 };
      items.forEach(function (t) { counts[getStatus(t)]++; });
      var total = items.length;

      var wrap = document.createElement("div");
      wrap.className = "cat" + (openCats[cat] ? " open" : "");

      var head = document.createElement("button");
      head.className = "cat-head";
      head.innerHTML =
        '<span class="cat-title"><h2>' + cat + '</h2><span class="count">' + counts.done + ' / ' + total + '</span></span>' +
        '<span class="cat-mini-bar" aria-hidden="true"></span>' +
        '<svg class="cat-chevron" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 6l6 6-6 6"/></svg>';
      var miniBar = head.querySelector(".cat-mini-bar");
      [["seg-done", counts.done], ["seg-progress", counts.progress], ["seg-question", counts.question]].forEach(function (seg) {
        if (seg[1] > 0) {
          var s = document.createElement("span");
          s.className = seg[0];
          s.style.width = (seg[1] / total * 100) + "%";
          miniBar.appendChild(s);
        }
      });
      head.addEventListener("click", function () {
        openCats[cat] = !openCats[cat];
        renderList();
      });

      var body = document.createElement("div");
      body.className = "cat-body";
      items.forEach(function (t) {
        var status = getStatus(t);
        var row = document.createElement("div");
        row.className = "item" + (status === "done" ? " is-done" : "");

        var btn = document.createElement("button");
        btn.className = "item-btn";
        btn.setAttribute("aria-label", t.text + "，目前狀態：" + STATUS_LABEL[status] + "，點擊切換");
        btn.innerHTML = '<span class="pill ' + status + '"><span class="dot"></span>' + STATUS_LABEL[status] + '</span>';
        btn.addEventListener("click", function () {
          setStatus(t.id, nextStatus(status));
          renderAll();
        });

        var textWrap = document.createElement("div");
        textWrap.className = "item-text";
        textWrap.innerHTML = '<span class="main">' + t.text + '</span>' + (t.note ? '<span class="note">' + t.note + '</span>' : '');

        row.appendChild(btn);
        row.appendChild(textWrap);
        if (t.date) {
          var dateEl = document.createElement("div");
          dateEl.className = "item-date tnum";
          dateEl.textContent = t.date.slice(5).replace("-", "/") + (t.isTarget ? " 目標" : "");
          row.appendChild(dateEl);
        }
        body.appendChild(row);
      });

      wrap.appendChild(head);
      wrap.appendChild(body);
      root.appendChild(wrap);
    });
  }

  function renderAll() {
    renderStats();
    renderBeam();
    renderList();
  }

  // open first category by default
  openCats[CATS[0]] = true;
  renderAll();

  // ---------- Tabs ----------
  var beamBtn = document.getElementById("tab-beam-btn");
  var listBtn = document.getElementById("tab-list-btn");
  var beamPanel = document.getElementById("panel-beam");
  var listPanel = document.getElementById("panel-list");
  beamBtn.addEventListener("click", function () {
    beamBtn.classList.add("active"); beamBtn.setAttribute("aria-selected", "true");
    listBtn.classList.remove("active"); listBtn.setAttribute("aria-selected", "false");
    beamPanel.classList.add("active"); listPanel.classList.remove("active");
  });
  listBtn.addEventListener("click", function () {
    listBtn.classList.add("active"); listBtn.setAttribute("aria-selected", "true");
    beamBtn.classList.remove("active"); beamBtn.setAttribute("aria-selected", "false");
    listPanel.classList.add("active"); beamPanel.classList.remove("active");
  });
})();
</script>
